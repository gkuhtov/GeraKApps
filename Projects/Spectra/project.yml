name: Spectra
options:
  bundleIdPrefix: com.gerak
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
targets:
  Spectra:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Sources
    resources:
      - path: Resources
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: "Spectra"
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Spectra использует локальную сеть для обнаружения совместимых устройств умного дома."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gerak.spectra
        SWIFT_VERSION: "5.9"
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        GENERATE_INFOPLIST_FILE: "NO"
