name: Spectra
options:
  bundleIdPrefix: com.gerak
targets:
  Spectra:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources:
      - path: Sources
      - path: Resources
        excludes:
          - "**/Info.plist"
    info:
      path: Configs/Info.plist
      properties:
        CFBundleIdentifier: com.gerak.spectra
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        UILaunchStoryboardName: ""
        UIUserInterfaceStyle: Dark
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_NAME: Spectra
        INFOPLIST_FILE: Configs/Info.plist
        CODE_SIGNING_ALLOWED: NO
