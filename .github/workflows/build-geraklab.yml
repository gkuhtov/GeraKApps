name: Сборка GeraKLab IPA

on:
  push:
    branches: ["main"]
    paths:
      - "Projects/GeraKLab/**"
      - ".github/workflows/build-geraklab.yml"
  pull_request:
    branches: ["main"]
    paths:
      - "Projects/GeraKLab/**"
      - ".github/workflows/build-geraklab.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: Projects/GeraKLab
    steps:
      - name: Клонирование репозитория
        uses: actions/checkout@v4
      - name: Загрузка оффлайн-нейромодели голоса Piper
        working-directory: .
        run: |
          mkdir -p Projects/GeraKLab/Resources
          curl -fL --retry 2 -o Projects/GeraKLab/Resources/ru_model.onnx https://huggingface.co/rhasspy/piper-voices/resolve/main/ru/ru_RU/dmitri/medium/ru_RU-dmitri-medium.onnx || echo "Модель не загружена; сборка продолжится без неё."
      - name: Установка XcodeGen
        working-directory: .
        run: brew install xcodegen
      - name: Генерация проекта Xcode
        run: xcodegen generate
      - name: Сборка приложения
        run: |
          xcodebuild build \
            -project GeraKLab.xcodeproj \
            -scheme GeraKLab \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Упаковка IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/GeraKLab.app Payload/
          zip -qr GeraKLab.ipa Payload
          rm -rf Payload
      - name: Выгрузка IPA в артефакты
        uses: actions/upload-artifact@v4
        with:
          name: GeraKLab-IPA
          path: Projects/GeraKLab/GeraKLab.ipa
          retention-days: 14
