name: Сборка Spectra IPA

on:
  push:
    paths:
      - 'Projects/Spectra/**'
      - '.github/workflows/build-spectra.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Получение кода репозитория
        uses: actions/checkout@v4

      - name: Установка XcodeGen
        run: brew install xcodegen

      - name: Генерация проекта Xcode
        working-directory: Projects/Spectra
        run: xcodegen generate

      - name: Компиляция приложения Spectra
        working-directory: Projects/Spectra
        run: |
          xcodebuild -project Spectra.xcodeproj \
            -scheme Spectra \
            -sdk iphoneos \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Упаковка в IPA
        working-directory: Projects/Spectra
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "Spectra.app" -type d | head -n 1)
          cp -r "$APP_PATH" Payload/
          zip -r Spectra.ipa Payload/

      - name: Выгрузка готового IPA
        uses: actions/upload-artifact@v4
        with:
          name: Spectra-IPA
          path: Projects/Spectra/Spectra.ipa
